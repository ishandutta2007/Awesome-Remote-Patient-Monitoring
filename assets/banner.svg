<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#081020" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- ECG Animation Styles -->
    <style>
      .ecg-line {
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: pulseWave 4s linear infinite;
      }
      .beacon-1 {
        animation: blink 2s ease-in-out infinite;
      }
      .beacon-2 {
        animation: blink 2s ease-in-out infinite 0.7s;
      }
      .beacon-3 {
        animation: blink 2s ease-in-out infinite 1.4s;
      }
      .scan-line {
        animation: scan 6s ease-in-out infinite alternate;
      }
      .badge-float {
        animation: float 4s ease-in-out infinite;
      }
      .badge-float-2 {
        animation: float 4s ease-in-out infinite 2s;
      }
      @keyframes pulseWave {
        0% {
          stroke-dashoffset: 1200;
        }
        50% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: -1200;
        }
      }
      @keyframes blink {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes scan {
        0% { transform: translateX(0px); opacity: 0.1; }
        50% { opacity: 0.6; }
        100% { transform: translateX(600px); opacity: 0.1; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="100" r="180" fill="#0ea5e9" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="220" fill="#8b5cf6" opacity="0.1" filter="url(#glow)" />
  <circle cx="650" cy="200" r="140" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Decorative Scanning Beam -->
  <rect class="scan-line" x="300" y="40" width="80" height="320" fill="url(#primaryGlow)" opacity="0.05" />

  <!-- Title & Branding Section -->
  <g transform="translate(80, 80)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="16" cy="16" r="5" fill="#10b981" class="beacon-1" />
    <text x="32" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CONNECTED DIGITAL HEALTH</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome <tspan fill="url(#primaryGlow)">Remote Patient</tspan>
    </text>
    <text x="0" y="130" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Monitoring <tspan fill="#38bdf8">(RPM)</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Curated ecosystem of SaaS platforms, open-source telemetry, FHIR backends &amp; IoT vitals
    </text>
  </g>

  <!-- Vital Signs Telemetry Cards (Dynamic Right Section) -->
  <g transform="translate(780, 50)">
    <!-- Heart Rate Card -->
    <g class="badge-float" transform="translate(0, 0)">
      <rect width="340" height="74" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="36" cy="37" r="18" fill="#ef4444" fill-opacity="0.15" />
      <path d="M 36 44 C 36 44 26 38 26 31 C 26 27.5 28.5 25 31.5 25 C 33.5 25 35 26.2 36 27.5 C 37 26.2 38.5 25 40.5 25 C 43.5 25 46 27.5 46 31 C 46 38 36 44 36 44 Z" fill="#ef4444" />
      <text x="70" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">HEART RATE (ECG)</text>
      <text x="70" y="56" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">72 <tspan font-size="13" font-weight="500" fill="#64748b">BPM</tspan></text>
      <circle cx="305" cy="37" r="5" fill="#10b981" class="beacon-1" />
      <text x="250" y="41" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">NORMAL</text>
    </g>

    <!-- Blood Oxygen & Pressure Card -->
    <g class="badge-float-2" transform="translate(0, 90)">
      <rect width="340" height="74" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="36" cy="37" r="18" fill="#0ea5e9" fill-opacity="0.15" />
      <path d="M 36 26 C 36 26 28 35 28 39 C 28 43.4 31.6 47 36 47 C 40.4 47 44 43.4 44 39 C 44 35 36 26 36 26 Z" fill="#0ea5e9" />
      <text x="70" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">OXYGEN (SpO2) / BP</text>
      <text x="70" y="56" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">99% <tspan font-size="14" font-weight="500" fill="#64748b">| 120/80</tspan></text>
      <circle cx="305" cy="37" r="5" fill="#38bdf8" class="beacon-2" />
      <text x="260" y="41" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">ACTIVE</text>
    </g>

    <!-- FHIR & Medical IoT Status Card -->
    <g class="badge-float" transform="translate(0, 180)">
      <rect width="340" height="74" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="36" cy="37" r="18" fill="#8b5cf6" fill-opacity="0.15" />
      <!-- IoT Wave Icon -->
      <path d="M 31 37 A 5 5 0 0 1 41 37 M 28 37 A 8 8 0 0 1 44 37 M 25 37 A 11 11 0 0 1 47 37" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
      <circle cx="36" cy="37" r="2" fill="#a855f7" />
      <text x="70" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">HL7 FHIR / BLE &amp; 4G</text>
      <text x="70" y="56" fill="#ffffff" font-family="sans-serif" font-size="19" font-weight="800">SYNCED <tspan font-size="13" font-weight="500" fill="#64748b">Real-time Stream</tspan></text>
      <circle cx="305" cy="37" r="5" fill="#a855f7" class="beacon-3" />
      <text x="252" y="41" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="600">ONLINE</text>
    </g>
  </g>

  <!-- Live Dynamic Animated ECG Waveform running at the bottom -->
  <g transform="translate(0, 310)">
    <!-- Base track line -->
    <path d="M 0 45 L 80 45 L 120 45 L 140 30 L 155 58 L 175 5 L 195 75 L 210 38 L 225 45 L 340 45 L 380 45 L 400 30 L 415 58 L 435 5 L 455 75 L 470 38 L 485 45 L 600 45 L 640 45 L 660 30 L 675 58 L 695 5 L 715 75 L 730 38 L 745 45 L 860 45 L 900 45 L 920 30 L 935 58 L 955 5 L 975 75 L 990 38 L 1005 45 L 1120 45 L 1200 45" 
          fill="none" stroke="#1e293b" stroke-width="3" opacity="0.6" />

    <!-- Animated ECG Pulse Wave -->
    <path class="ecg-line" d="M 0 45 L 80 45 L 120 45 L 140 30 L 155 58 L 175 5 L 195 75 L 210 38 L 225 45 L 340 45 L 380 45 L 400 30 L 415 58 L 435 5 L 455 75 L 470 38 L 485 45 L 600 45 L 640 45 L 660 30 L 675 58 L 695 5 L 715 75 L 730 38 L 745 45 L 860 45 L 900 45 L 920 30 L 935 58 L 955 5 L 975 75 L 990 38 L 1005 45 L 1120 45 L 1200 45" 
          fill="none" stroke="url(#ecgGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />
  </g>
</svg>
